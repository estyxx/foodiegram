<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispensa</title>

    <meta name="theme-color" content="#1E5E59" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/dispensa-favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dispensa" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/shell.css" />
  </head>
  <body data-shell="checking">
    <a class="skip-link" href="#view">Skip to content</a>

    <!-- Shown until the app knows who is there: no navigation, no data. -->
    <div class="gate" id="gate">
      <img class="gate__logo" src="/icons/dispensa-icon-512.svg" alt="" width="88" height="88" />
      <p class="gate__word">Dispensa</p>
      <div class="gate__body" id="gate-body"></div>
    </div>

    <header class="app-header">
      <a class="brand" id="brand" href="#plan" aria-label="Dispensa, home">
        <img class="brand__mark" src="/icons/dispensa-favicon.svg" alt="" width="28" height="28" />
        <span class="brand__word">Dispensa</span>
      </a>
      <nav class="app-nav" aria-label="Main">
        <ul class="app-nav__list">
          <li><a class="app-nav__link" href="#plan" data-route="plan">Plan</a></li>
          <li><a class="app-nav__link" href="#browse" data-route="browse">Browse</a></li>
          <li><a class="app-nav__link" href="#pantry" data-route="pantry">Pantry</a></li>
          <li><a class="app-nav__link" href="#plan" data-route="shop" data-shop-link>Shop</a></li>
          <li><a class="app-nav__link" href="#queue" data-route="queue">Queue</a></li>
          <li><a class="app-nav__link" href="#favourites" data-route="favourites">Favourites</a></li>
          <li><a class="app-nav__link" href="/schiena.html">Back exercises</a></li>
        </ul>
      </nav>
      <div class="account" id="account" hidden>
        <button class="account__disc" id="account-disc" type="button" aria-haspopup="dialog">
          <span class="avatar" data-account-initial aria-hidden="true"></span>
          <span class="account__tick" aria-hidden="true"
            ><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg
          ></span>
        </button>
        <button
          class="account__pill"
          id="account-pill"
          type="button"
          popovertarget="account-menu"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="avatar" data-account-initial aria-hidden="true"></span>
          <span class="account__email" data-account-email></span>
          <svg class="icon icon--xs" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 9.5 6 6 6-6" />
          </svg>
        </button>
      </div>
      <a class="signin" id="signin" href="/auth/login" hidden>
        <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4.5h3.5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H14M10.5 8l4 4-4 4M14.5 12H4.5" />
        </svg>
        Sign in
      </a>
    </header>

    <div class="account-menu" id="account-menu" popover>
      <div class="account-menu__who">
        <span class="shell-label">Signed in as</span>
        <span class="account-menu__email" data-account-email></span>
      </div>
      <button class="account-menu__item" type="button" data-sign-out>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10M14.5 8l4 4-4 4M18.5 12H9.5" />
        </svg>
        Sign out
      </button>
    </div>

    <main class="app-main" id="view" tabindex="-1"></main>

    <footer class="app-footer">
      <div class="app-footer__inner">
        <div class="app-footer__brand">
          <img class="app-footer__mark" src="/icons/dispensa-favicon.svg" alt="" width="22" height="22" />
          <span class="app-footer__word">Dispensa</span>
          <span class="app-footer__tagline">Mediterranean meal planner</span>
        </div>
        <span class="app-footer__version" id="app-version" aria-live="polite"></span>
      </div>
    </footer>

    <nav class="tabbar" aria-label="Main">
      <a class="tabbar__tab" href="#plan" data-route="plan">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5.5" width="16" height="14" rx="2.5" />
          <path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" />
        </svg>
        <span>Plan</span>
      </a>
      <a class="tabbar__tab" href="#browse" data-route="browse">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6" />
          <path d="m15.5 15.5 4.5 4.5" />
        </svg>
        <span>Browse</span>
      </a>
      <a class="tabbar__tab" href="#pantry" data-route="pantry">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8 4h8M8.5 4v2.5C7 7.3 6 8.5 6 10.5V18a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-7.5c0-2-1-3.2-2.5-4V4M6 12.5h12"
          />
        </svg>
        <span>Pantry</span>
      </a>
      <a class="tabbar__tab" href="#plan" data-route="shop" data-shop-link>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 10h16l-1.6 8.2a1.5 1.5 0 0 1-1.5 1.3H7.1a1.5 1.5 0 0 1-1.5-1.3L4 10ZM8.5 10l3-5.5M15.5 10l-3-5.5"
          />
        </svg>
        <span>Shop</span>
      </a>
      <button
        class="tabbar__tab"
        id="more-button"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h14M5 12h14M5 17h14" />
        </svg>
        <span>More</span>
      </button>
    </nav>

    <dialog class="more" id="more-sheet" aria-label="More">
      <div class="more__head">
        <span class="shell-label shell-label--accent">More</span>
        <button class="more__close" type="button" id="more-close" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6.5 6.5 11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
      <a class="more__row" href="#queue" data-route="queue">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h14M5 12h14M5 17h9" />
        </svg>
        <span class="more__row-label">Queue</span>
        <svg class="icon more__chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </a>
      <a class="more__row" href="#favourites" data-route="favourites">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6Z"
          />
        </svg>
        <span class="more__row-label">Favourites</span>
        <svg class="icon more__chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </a>
      <a class="more__row" href="/schiena.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="5" r="1.8" />
          <path d="M12 7.5V14M7 10.5l5-1.5 5 1.5M12 14l-3 5.5M12 14l3 5.5" />
        </svg>
        <span class="more__row-label">Back exercises</span>
        <svg class="icon more__chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </a>
      <div class="more__account" id="more-account" hidden>
        <div class="more__who">
          <span class="avatar avatar--lg" data-account-initial aria-hidden="true"></span>
          <div class="more__who-text">
            <span class="shell-label">Signed in</span>
            <span class="more__email" data-account-email></span>
          </div>
        </div>
        <button class="more__signout" type="button" data-sign-out>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10M14.5 8l4 4-4 4M18.5 12H9.5"
            />
          </svg>
          Sign out
        </button>
      </div>
    </dialog>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
