[project]
name = "foodiegram"
version = "0.1.0"
description = "Extract, parse, and tag recipes from your instagram saved collections"
readme = "README.md"
authors = [
    { name = "Ester Beltrami", email = "beltrami.ester@gmail.com" }
]
keywords = ["instagram", "recipes", "ocr", "nlp", "data-extraction"]
requires-python = ">=3.14"
dependencies = [
    "cloudinary>=1.44.1",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.115",
    "instagrapi>=2.10.6",
    "openai>=1.99.9",
    "pydantic>=2.11.7",
    "pydantic-ai-slim[openai]>=0.7.2",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
foodiegram-api = "foodiegram.api:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 89
fix = true
# Standalone reference artifacts that are not part of the package.
extend-exclude = ["Recipe Management System Architecture", "cookstagram-data"]


[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", # https://docs.astral.sh/ruff/rules/undocumented-public-module/
"D104", # https://docs.astral.sh/ruff/rules/undocumented-public-package/
"D203", # https://docs.astral.sh/ruff/rules/incorrect-blank-line-before-class/
"D213", # https://docs.astral.sh/ruff/rules/multi-line-summary-second-line/
"PLR0913", # query/filter methods legitimately take many keyword-only args
"COM812", # conflicts with ruff formatter (trailing comma enforcement)
]
[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates model field types at class-definition time via model_rebuild();
# moving those imports into TYPE_CHECKING would break validation.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# Standalone migration/utility scripts are not an importable package.
# T201: print() is the intended output mechanism for CLI scripts.
# PLR2004: small literal constants are clear enough in script context.
"scripts/*" = ["INP001", "T201", "PLR2004"]
# `assert` and hardcoded test credentials are the expected idiom in tests.
"tests/*" = ["S101", "S105", "S106"]
# extractor: Client and Settings used at runtime (class attrs + property body).
"src/foodiegram/instagram/extractor.py" = ["TC001", "TC002"]
# S104: "0.0.0.0" is intentional — the server must bind to all interfaces in prod.
"src/foodiegram/settings.py" = ["S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

# instagrapi and cloudinary ship no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["instagrapi.*", "cloudinary.*"]
ignore_missing_imports = true


[dependency-groups]
dev = [
    "import-linter>=2.3",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

# ── import-linter ─────────────────────────────────────────────────────────────
# Two contracts from CLAUDE.md rule 22.
# Contract 1 ("domain-is-pure") is fully active from Phase 0.
# Contract 2 ("layers") covers the api→domain boundary now and will be expanded
# to the full hierarchy (api/scripts→app→storage|ai|instagram|images→domain) in
# Phase 0.3 once those packages are created.
[tool.importlinter]
root_packages = ["foodiegram"]

[[tool.importlinter.contracts]]
name = "domain-is-pure"
type = "forbidden"
source_modules = ["foodiegram.domain"]
forbidden_modules = [
    "foodiegram.storage",
    "foodiegram.ai",
    "foodiegram.instagram",
    "foodiegram.images",
    "foodiegram.app",
    "foodiegram.api",
]

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
# api sits at the top; domain is pure at the bottom.
# Adapter ordering (ai above storage) reflects that ai/batch currently imports
# from storage; peer adapters at the same conceptual level may import from each
# other and from anything below them.
layers = [
    "foodiegram.api",
    "foodiegram.app",
    "foodiegram.ai",
    "foodiegram.storage",
    "foodiegram.instagram",
    "foodiegram.images",
    "foodiegram.domain",
]
