name: Deploy to FastAPI Cloud
on:
  push:
    branches: [main]
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
      FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # The deployed artifact ships without .git, so the footer's commit hash comes
      # from GIT_SHA. Set it before deploying so the new build picks it up.
      - run: uv run --locked fastapi cloud env set GIT_SHA "$GITHUB_SHA" --app-id "$FASTAPI_CLOUD_APP_ID"
      - run: uv run --locked fastapi deploy
