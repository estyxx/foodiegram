name: CI

# Checks only. FastAPI Cloud deploys on push to main by itself (D37); nothing
# here deploys or holds a deploy secret.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # POSTGRES_USER is created as a superuser, which one promotion test
          # needs (SET session_replication_role). The image's timezone is UTC,
          # which the storage round-trip tests need.
          POSTGRES_USER: dispensa
          POSTGRES_PASSWORD: dispensa
          POSTGRES_DB: dispensa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: make check
      # `make check` auto-fixes lint and formatting, which would hide them
      # here; any file it had to change fails the run instead.
      - run: git diff --exit-code
